# group_vars/domain_controllers/directory.yml
# =============================================================================
# Objets Active Directory : OU, groupes, comptes de service.
# Les UTILISATEURS HUMAINS ne sont PLUS définis ici : ils sont décrits dans le
# CSV inventories/prod/files/ad_users.csv et créés par le rôle ad_users.
# =============================================================================

ad_ous:
  - name: "Postes"          # OU des postes de travail (cible de la GPO GLPI Agent)
    path: "DC=cynto,DC=tech"

  - name: "Serveurs"
    path: "DC=cynto,DC=tech"

  - name: "Utilisateurs"
    path: "DC=cynto,DC=tech"

  - name: "Groupes"
    path: "DC=cynto,DC=tech"

  - name: "Nextcloud-Groupes"
    path: "OU=Groupes,DC=cynto,DC=tech"
  
  - name: "GLPI-Groupes"
    path: "OU=Groupes,DC=cynto,DC=tech"

  - name: "ALL_Utilisateurs"
    path: "OU=Utilisateurs,DC=cynto,DC=tech"

  - name: "Admins"
    path: "OU=ALL_Utilisateurs,OU=Utilisateurs,DC=cynto,DC=tech"

  - name: "Commerciaux"
    path: "OU=ALL_Utilisateurs,OU=Utilisateurs,DC=cynto,DC=tech"

  - name: "Comptes de service"
    path: "OU=Utilisateurs,DC=cynto,DC=tech"

# -----------------------------------------------------------------------------
# Correspondance clé d'OU (colonne "ou" du CSV ad_users.csv) -> DN complet.
# Pour ajouter une destination, créez l'OU dans ad_ous ci-dessus puis ajoutez
# une entrée ici, et utilisez la clé dans la colonne "ou" du CSV.
# -----------------------------------------------------------------------------
ad_user_ou_map:
  Admins: "OU=Admins,OU=ALL_Utilisateurs,OU=Utilisateurs,DC=cynto,DC=tech"
  Commerciaux: "OU=Commerciaux,OU=ALL_Utilisateurs,OU=Utilisateurs,DC=cynto,DC=tech"
  Utilisateurs: "OU=ALL_Utilisateurs,OU=Utilisateurs,DC=cynto,DC=tech"

ad_groups:
  - name: "GG_Admins_Infra"
    scope: "global"
    category: "security"
    path: "OU=Groupes,DC=cynto,DC=tech"

  - name: "GG_Utilisateurs_Standard"
    scope: "global"
    category: "security"
    path: "OU=Groupes,DC=cynto,DC=tech"

  - name: "GG_Serveurs_Admin"
    scope: "global"
    category: "security"
    path: "OU=Groupes,DC=cynto,DC=tech"
  
  - name: "GG_VPN_Users"
    scope: "global"
    category: "security"
    path: "OU=Groupes,DC=cynto,DC=tech"
  
  - name: "GG_Nextcloud_Users"
    scope: "global"
    category: "security"
    path: "OU=Nextcloud-Groupes,OU=Groupes,DC=cynto,DC=tech"
  
  - name: "GG_Nextcloud_Admins"
    scope: "global"
    category: "security"
    path: "OU=Nextcloud-Groupes,OU=Groupes,DC=cynto,DC=tech"

  - name: "GG_Nextcloud_50gb"
    scope: "global"
    category: "security"
    path: "OU=Nextcloud-Groupes,OU=Groupes,DC=cynto,DC=tech"
  
  - name: "GG_Nextcloud_10gb"
    scope: "global"
    category: "security"
    path: "OU=Nextcloud-Groupes,OU=Groupes,DC=cynto,DC=tech"

  - name: "GG_Nextcloud_5gb"
    scope: "global"
    category: "security"
    path: "OU=Nextcloud-Groupes,OU=Groupes,DC=cynto,DC=tech"

### GLPI Groups
  - name: "GG_GLPI_Admin"
    scope: "global"
    category: "security"
    path: "OU=GLPI-Groupes,OU=Groupes,DC=cynto,DC=tech"
  
  - name: "GG_GLPI_Tech"
    scope: "global"
    category: "security"
    path: "OU=GLPI-Groupes,OU=Groupes,DC=cynto,DC=tech"

  - name: "GG_GLPI_Users"
    scope: "global"
    category: "security"
    path: "OU=GLPI-Groupes,OU=Groupes,DC=cynto,DC=tech"

# -----------------------------------------------------------------------------
# Comptes de SERVICE (non humains). Gérés en YAML, pas dans le CSV.
# Mot de passe posé à la création seulement (update_password: on_create dans le
# rôle), n'expire jamais, jamais forcés à changer.
# -----------------------------------------------------------------------------
ad_service_accounts:
  - name: "svc_wsus"
    firstname: "svc"
    surname: "wsus"
    display_name: "Service WSUS"
    upn: "svc_wsus@cynto.tech"
    password: "{{ vault_service_account_password }}"
    path: "OU=Comptes de service,OU=Utilisateurs,DC=cynto,DC=tech"
    enabled: true
    password_never_expires: true
    groups: []
  
  - name: "svc_nextcloud"
    firstname: "svc"
    surname: "nextcloud"
    display_name: "Service Nextcloud"
    upn: "svc_nextcloud@cynto.tech"
    password: "{{ vault_service_account_password }}"
    path: "OU=Comptes de service,OU=Utilisateurs,DC=cynto,DC=tech"
    enabled: true
    password_never_expires: true
    groups: []

  - name: "svc-glpi"
    firstname: "svc"
    surname: "glpi"
    display_name: "Service GLPI"
    upn: "svc_glpi@cynto.tech"
    password: "{{ vault_service_account_password }}"
    path: "OU=Comptes de service,OU=Utilisateurs,DC=cynto,DC=tech"
    enabled: true
    password_never_expires: true
    groups: []
  
  - name: "svc_pfsense"
    firstname: "svc"
    surname: "pfsense"
    display_name: "Service PFSense"
    upn: "svc_pfsense@cynto.tech"
    password: "{{ vault_service_account_password }}"
    path: "OU=Comptes de service,OU=Utilisateurs,DC=cynto,DC=tech"
    enabled: true
    password_never_expires: true
    groups: []
