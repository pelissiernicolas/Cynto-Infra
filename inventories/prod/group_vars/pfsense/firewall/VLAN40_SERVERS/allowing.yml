# group_vars/pfsense/firewall/VLAN40_SERVERS/allowing.yml
# Règles d'AUTORISATION du VLAN serveurs (VLAN40_SERVERS).
fw_vlan40_servers_allow:

  - name: VLAN40_SERVERS_to_AD_TCP
    interface: VLAN40_SERVERS
    action: pass
    protocol: tcp
    source: VLAN40_SERVERS_NET
    destination: AD_SERVERS
    destination_port: AD_PORTS_TCP
    description: Serveurs vers AD TCP

  - name: VLAN40_SERVERS_to_AD_UDP
    interface: VLAN40_SERVERS
    action: pass
    protocol: udp
    source: VLAN40_SERVERS_NET
    destination: AD_SERVERS
    destination_port: AD_PORTS_UDP
    description: Serveurs vers AD UDP

  - name: VLAN40_SERVERS_to_WEB
    interface: VLAN40_SERVERS
    action: pass
    protocol: tcp/udp
    source: VLAN40_SERVERS_NET
    destination: any
    destination_port: WEB_PORTS
    description: Updates serveurs HTTP HTTPS

  - name: VLAN40_Zabbix_to_PFSENSE_SNMP
    interface: VLAN40_SERVERS
    action: pass
    protocol: udp
    source: 10.8.40.15
    destination: "(self)"
    destination_port: 161
    description: Zabbix vers pfSense SNMP

  - name: VLAN40_Zabbix_to_SG500_SNMP
    interface: VLAN40_SERVERS
    action: pass
    protocol: udp
    source: 10.8.40.15
    destination: 10.8.99.2
    destination_port: 161
    description: Zabbix vers switch SG500 SNMP

  - name: VLAN40_Zabbix_to_SNTP_free
    interface: VLAN40_SERVERS
    action: pass
    protocol: tcp
    source: 10.8.40.15
    destination: any
    destination_port: 587
    description: Zabbix vers SNTP Free

  - name: VLAN40_Zabbix_to_QNAP_SNMP
    interface: VLAN40_SERVERS
    action: pass
    protocol: udp
    source: 10.8.40.15
    destination: 10.8.99.10
    destination_port: 161
    description: Zabbix vers switch SG500 SNMP

  - name: VLAN40_PBS_to_NAS
    interface: VLAN40_SERVERS
    action: pass
    protocol: any
    source: 10.8.40.14
    destination: 10.8.99.10
    description: PBS vers NAS 

  - name: VLAN40_PBS_to_NAS_NFS
    interface: VLAN40_SERVERS
    action: pass
    protocol: tcp/udp
    source: 10.8.40.14
    destination: 10.8.99.10
    destination_port: 2049
    description: PBS vers NAS port 2049 NFS
