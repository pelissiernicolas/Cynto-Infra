pfsense_blocking_rules:

#### VLAN20_USERS Rules ####

  - name: BLOCK_VLAN20_to_VLAN10
    interface: VLAN20_USERS
    action: block
    protocol: any
    source: VLAN20_USERS_NET
    destination: VLAN10_ADMIN_NET
    description: Bloquer utilisateurs vers admin

  - name: BLOCK_VLAN20_to_VLAN40
    interface: VLAN20_USERS
    action: block
    protocol: any
    source: VLAN20_USERS_NET
    destination: VLAN40_SERVERS_NET
    description: Bloquer utilisateurs vers serveurs (hors règles autorisées)

  - name: BLOCK_ALL_to_pfSense
    interface: VLAN20_USERS
    action: block
    protocol: any
    source: VLAN20_USERS_NET
    destination: "(self)"
    description: Bloquer accès pfSense depuis VLAN20
    
#### VLAN40_SERVERS Rules ####

  - name: BLOCK_VLAN40_to_VLAN10
    interface: VLAN40_SERVERS
    action: block
    protocol: any
    source: VLAN40_SERVERS_NET
    destination: VLAN10_ADMIN_NET
    description: Bloquer serveurs vers admin

  - name: BLOCK_ALL_to_pfSense_SERVERS
    interface: VLAN40_SERVERS
    action: block
    protocol: any
    source: VLAN40_SERVERS_NET
    destination: "(self)"
    description: Bloquer accès pfSense depuis VLAN40