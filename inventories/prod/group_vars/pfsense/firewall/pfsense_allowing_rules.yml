pfsense_allowing_rules:

#### VLAN10_ADMIN Rules ####

  - name: VLAN10_ADMIN_to_pfSense_SSH
    interface: VLAN10_ADMIN
    action: pass
    protocol: tcp
    source: VLAN10_ADMIN_NET
    destination: (self)
    destination_port: 22
    description: Autoriser SSH vers pfSense depuis VLAN10

  - name: VLAN10_ADMIN_to_pfSense_HTTPS
    interface: VLAN10_ADMIN
    action: pass
    protocol: tcp
    source: VLAN10_ADMIN_NET
    destination: (self)
    destination_port: 443
    description: Autoriser HTTPS vers pfSense depuis VLAN10

  - name: VLAN10_ADMIN_to_ALL_ADMIN_PORTS
    interface: VLAN10_ADMIN
    action: pass
    protocol: tcp
    source: VLAN10_ADMIN_NET
    destination: any
    destination_port: ADMIN_PORTS
    description: Administration des serveurs depuis VLAN10

#### VLAN20_USERS Rules ####

  - name: VLAN20_USERS_to_DNS_AD_TCP
    interface: VLAN20_USERS
    action: pass
    protocol: tcp
    source: VLAN20_USERS_NET
    destination: AD_SERVERS
    destination_port: DNS_PORTS
    description: DNS TCP vers AD

  - name: VLAN20_USERS_to_DNS_AD_UDP
    interface: VLAN20_USERS
    action: pass
    protocol: udp
    source: VLAN20_USERS_NET
    destination: AD_SERVERS
    destination_port: DNS_PORTS
    description: DNS UDP vers AD

  - name: VLAN20_USERS_to_WEB
    interface: VLAN20_USERS
    action: pass
    protocol: tcp/udp
    source: VLAN20_USERS_NET
    destination: any
    destination_port: WEB_PORTS
    description: Accès web utilisateurs

  - name: VLAN20_USERS_to_NEXTCLOUD
    interface: VLAN20_USERS
    action: pass
    protocol: tcp
    source: VLAN20_USERS_NET
    destination: NEXTCLOUD_SERVER
    destination_port: WEB_PORTS
    description: Accès Nextcloud depuis utilisateurs

#### VLAN40_SERVERS Rules ####

  - name: VLAN40_SERVERS_to_AD_TCP
    interface: VLAN40_SERVERS
    action: pass
    protocol: tcp
    source: VLAN40_SERVERS_NET
    destination: AD_SERVERS
    destination_port: AD_PORTS_TCP
    description: Serveurs vers AD TCP

  - name: VLAN40_SERVERS_to_AD_UDP
    interface: VLAN40_SERVERS
    action: pass
    protocol: udp
    source: VLAN40_SERVERS_NET
    destination: AD_SERVERS
    destination_port: AD_PORTS_UDP
    description: Serveurs vers AD UDP

  - name: VLAN40_SERVERS_to_WEB
    interface: VLAN40_SERVERS
    action: pass
    protocol: tcp
    source: VLAN40_SERVERS_NET
    destination: any
    destination_port: WEB_PORTS
    description: Updates serveurs HTTP HTTPS