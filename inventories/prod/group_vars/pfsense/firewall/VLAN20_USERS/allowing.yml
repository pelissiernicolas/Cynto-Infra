# group_vars/pfsense/firewall/VLAN20_USERS/allowing.yml
# Règles d'AUTORISATION du VLAN utilisateurs (VLAN20_USERS).
fw_vlan20_users_allow:

  - name: VLAN20_USERS_to_DHCP_RELAY
    interface: VLAN20_USERS
    action: pass
    protocol: udp
    source: any
    destination: any
    destination_port: DHCP_PORTS
    description: DHCP utilisateurs vers relais pfSense

  - name: VLAN20_USERS_to_DNS_AD_TCP
    interface: VLAN20_USERS
    action: pass
    protocol: tcp
    source: VLAN20_USERS_NET
    destination: AD_SERVERS
    destination_port: DNS_PORTS
    description: DNS TCP vers AD

  - name: VLAN20_USERS_to_DNS_AD_UDP
    interface: VLAN20_USERS
    action: pass
    protocol: udp
    source: VLAN20_USERS_NET
    destination: AD_SERVERS
    destination_port: DNS_PORTS
    description: DNS UDP vers AD

  - name: VLAN20_USERS_to_AD_TCP
    interface: VLAN20_USERS
    action: pass
    protocol: tcp
    source: VLAN20_USERS_NET
    destination: AD_SERVERS
    destination_port: AD_PORTS_TCP
    description: Jonction domaine et authentification AD TCP

  - name: VLAN20_USERS_to_AD_UDP
    interface: VLAN20_USERS
    action: pass
    protocol: udp
    source: VLAN20_USERS_NET
    destination: AD_SERVERS
    destination_port: AD_PORTS_UDP
    description: Jonction domaine et authentification AD UDP

  # pfSense ne propose pas toujours "tcp/udp" pour une règle avec alias de ports :
  # on scinde en deux règles équivalentes (une TCP, une UDP).
  - name: VLAN20_USERS_to_WEB_TCP
    interface: VLAN20_USERS
    action: pass
    protocol: tcp/udp
    source: VLAN20_USERS_NET
    destination: any
    destination_port: WEB_PORTS
    description: Accès web utilisateurs (TCP)

  # - name: VLAN20_USERS_to_WEB_UDP
  #   interface: VLAN20_USERS
  #   action: pass
  #   protocol: udp
  #   source: VLAN20_USERS_NET
  #   destination: any
  #   destination_port: WEB_PORTS
  #   description: Accès web utilisateurs (UDP)

  - name: VLAN20_USERS_to_NEXTCLOUD
    interface: VLAN20_USERS
    action: pass
    protocol: tcp
    source: VLAN20_USERS_NET
    destination: NEXTCLOUD_SERVER
    destination_port: WEB_PORTS
    description: Accès Nextcloud depuis utilisateurs

  - name: VLAN20_USERS_to_VNC_VLAN99
    interface: VLAN20_USERS
    action: pass
    protocol: tcp
    source: VLAN20_USERS_NET
    destination: VLAN99_MANAGEMENT_NET
    destination_port: 5900
    description: Accès VNC depuis utilisateurs vers VLAN99_MANAGEMENT

  - name: VLAN20_USERS_to_WSUS_HTTP
    interface: VLAN20_USERS
    action: pass
    protocol: tcp
    source: VLAN20_USERS_NET
    destination: WSUS_SERVER
    destination_port: WSUS_HTTP_PORT
    description: Accès WSUS HTTP depuis utilisateurs
