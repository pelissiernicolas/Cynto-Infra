# group_vars/pfsense/firewall/VLAN20_USERS/allowing.yml
# Regles d'AUTORISATION du VLAN utilisateurs (VLAN20_USERS).
fw_vlan20_users_allow_internal:

  - name: VLAN20_USERS_to_DHCP_RELAY
    interface: VLAN20_USERS
    action: pass
    protocol: udp
    source: any
    destination: any
    destination_port: DHCP_PORTS
    description: DHCP utilisateurs vers relais pfSense

  - name: VLAN20_USERS_to_DNS_AD
    interface: VLAN20_USERS
    action: pass
    protocol: tcp/udp
    source: VLAN20_USERS_NET
    destination: AD_SERVERS
    destination_port: DNS_PORTS
    description: DNS utilisateurs vers AD

  - name: VLAN20_USERS_to_AD
    interface: VLAN20_USERS
    action: pass
    protocol: tcp/udp
    source: VLAN20_USERS_NET
    destination: AD_SERVERS
    destination_port: AD_PORTS
    description: Jonction domaine et authentification AD

  - name: VLAN20_USERS_to_NEXTCLOUD_WEB
    interface: VLAN20_USERS
    action: pass
    protocol: tcp
    source: VLAN20_USERS_NET
    destination: NEXTCLOUD_SERVER
    destination_port: WEB_PORTS
    description: Acces Nextcloud depuis utilisateurs

  - name: VLAN20_USERS_to_GLPI_WEB
    interface: VLAN20_USERS
    action: pass
    protocol: tcp
    source: VLAN20_USERS_NET
    destination: GLPI_SERVER
    destination_port: WEB_PORTS
    description: Acces GLPI depuis utilisateurs

  - name: VLAN20_USERS_to_WSUS_HTTP
    interface: VLAN20_USERS
    action: pass
    protocol: tcp
    source: VLAN20_USERS_NET
    destination: WSUS_SERVER
    destination_port: WSUS_HTTP_PORT
    description: Acces WSUS HTTP depuis utilisateurs

  - name: VLAN20_USERS_to_WAZUH_AGENT
    interface: VLAN20_USERS
    action: pass
    protocol: tcp
    source: VLAN20_USERS_NET
    destination: WAZUH_SERVER
    destination_port: WAZUH_AGENT_PORTS
    description: Agents Wazuh utilisateurs vers manager

  - name: VLAN20_USERS_to_ZABBIX_ACTIVE
    interface: VLAN20_USERS
    action: pass
    protocol: tcp
    source: VLAN20_USERS_NET
    destination: ZABBIX_SERVER
    destination_port: ZABBIX_SERVER_PORT
    description: Agents Zabbix actifs utilisateurs vers serveur

fw_vlan20_users_allow_internet:

  - name: VLAN20_USERS_to_INTERNET_WEB
    interface: VLAN20_USERS
    action: pass
    protocol: tcp
    source: VLAN20_USERS_NET
    destination: any
    destination_port: WEB_PORTS
    description: Acces web Internet utilisateurs

fw_vlan20_users_allow: "{{ fw_vlan20_users_allow_internal + fw_vlan20_users_allow_internet }}"
fw_vlan20_users_rules: "{{ fw_vlan20_users_allow_internal + fw_vlan20_users_block + fw_vlan20_users_allow_internet }}"
