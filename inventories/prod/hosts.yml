# inventories/prod/hosts.yml
# Inventaire UNIFIÉ de l'infrastructure Cynto (fusion AD + pfSense + Nextcloud + GLPI).
#
# Réseau serveurs harmonisé sur 10.8.40.0/24 (voir README > "À vérifier avant déploiement").
# Les variables de connexion Windows (WinRM) sont centralisées dans group_vars/windows.yml.
---
all:
  children:

    # ----------------------- Pare-feu / Réseau -----------------------
    pfsense:
      hosts:
        fw-pfsense:
          ansible_host: 192.168.10.17          # interface d'administration du pfSense (à adapter)
          server_hostname: fw-pfsense
          server_fqdn: pfsense.cynto.tech
          ansible_user: cyntoadmin
          ansible_connection: ssh
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
          ansible_become: true
          ansible_become_method: sudo
          ansible_python_interpreter: /usr/local/bin/python3.11

    # ----------------------- Active Directory / Windows -----------------------
    windows:
      hosts:
        srv-ad-01:
          ansible_host: 10.8.40.10
        srv-ad-02:
          ansible_host: 10.8.40.11
        srv-wsus-01:
          ansible_host: 10.8.40.16

    domain_controllers:
      hosts:
        srv-ad-01:
        srv-ad-02:

    primary_dc:
      hosts:
        srv-ad-01:

    secondary_dcs:
      hosts:
        srv-ad-02:

    wsus_servers:
      hosts:
        srv-wsus-01:

    member_servers:
      hosts:
        srv-wsus-01:

    # Groupe "ad" : cible des playbooks AD CS / LDAPS (le DC principal porte la CA).
    # srv-ad-01 appartient aussi à "windows" : il hérite donc des variables WinRM.
    ad:
      hosts:
        srv-ad-01:

    # ----------------------- Nextcloud -----------------------
    nextcloud:
      hosts:
        srv-nextcloud-01:
          ansible_host: 10.8.40.12
          ansible_user: cyntoadmin
          ansible_password: "{{ vault_ansible_ssh_password }}"
          ansible_become_password: "{{ vault_ansible_become_password }}"
          # Ubuntu 25/26 : remplace sudo par sudo.ws. À SUPPRIMER si la machine utilise sudo standard.
          ansible_become_exe: sudo.ws
    # ----------------------- GLPI -----------------------
    glpi:
      hosts:
        srv-glpi:
          ansible_host: 10.8.40.13               # HARMONISATION FUSION (était 192.168.1.51)
          ansible_user: cyntoadmin
          ansible_password: "{{ vault_ansible_ssh_password }}"
          ansible_become_password: "{{ vault_ansible_become_password }}"
          # Ubuntu 25/26 : remplace sudo par sudo.ws. À SUPPRIMER si la machine utilise sudo standard.
          ansible_become_exe: sudo.ws
    # ----------------------- Zabbix -----------------------
    zabbix:
      hosts:
        srv-zabbix-01:
          ansible_host: 10.8.40.15
          ansible_user: cyntoadmin
          ansible_password: "{{ vault_ansible_ssh_password }}"
          ansible_become_password: "{{ vault_ansible_become_password }}"
          # Ubuntu 25/26 : remplace sudo par sudo.ws. À SUPPRIMER si la machine utilise sudo standard.
          ansible_become_exe: sudo.ws

    # ----------------------- Proxmox / QDevice -----------------------
    proxmox:
      hosts:
        pve-01:
          ansible_host: 10.8.99.6
          ansible_user: root
          ansible_password: "{{ vault_proxmox_root_password }}"
          server_hostname: pve-01
          server_fqdn: pve-01.cynto.tech
        pve-02:
          ansible_host: 10.8.99.7
          ansible_user: root
          ansible_password: "{{ vault_proxmox_root_password }}"
          server_hostname: pve-02
          server_fqdn: pve-02.cynto.tech

    qdevice:
      hosts:
        qdevice-rpi:
          ansible_host: 10.8.99.8
          ansible_user: cyntoadmin
          ansible_password: "{{ vault_qdevice_ssh_password }}"
          ansible_become_password: "{{ vault_qdevice_become_password }}"
          server_hostname: qdevice-rpi
          server_fqdn: qdevice-rpi.cynto.tech

    # ----------------------- Switches -----------------------
    switches:
      hosts:
        sw-sg500-01:
          ansible_host: 10.8.99.2
          ansible_user: cyntoadmin
          ansible_password: "{{ vault_switch_ssh_password }}"
          ansible_connection: network_cli
          ansible_network_os: cisco.ios.ios
          ansible_become: false
          ansible_command_timeout: 60
          server_hostname: sw-sg500-01
          server_fqdn: sw-sg500-01.cynto.tech
