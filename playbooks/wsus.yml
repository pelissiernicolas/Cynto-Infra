# playbooks/wsus.yml
# SERVICE : WSUS (Windows Server Update Services).
# Cible : groupe wsus_servers.
---
- name: Préparer le serveur WSUS
  hosts: wsus_servers
  gather_facts: false
  roles:
    - role: win_base
    - role: win_network
    - role: member_server

- name: Installer et configurer WSUS
  hosts: wsus_servers
  gather_facts: false
  roles:
    - role: wsus

- name: Configurer les GPO WSUS
  hosts: primary_dc
  gather_facts: false
  roles:
    - role: gpo_wsus
