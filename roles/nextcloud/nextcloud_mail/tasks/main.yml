- name: Vérifier si Nextcloud est installé
  ansible.builtin.command:
    argv:
      - sudo
      - -u
      - www-data
      - php
      - "{{ nextcloud_web_root }}/occ"
      - status
  register: nextcloud_status_mail
  changed_when: false
  failed_when: false

- name: Définir l'email de l'utilisateur admin Nextcloud
  ansible.builtin.command:
    argv:
      - sudo
      - -u
      - www-data
      - php
      - "{{ nextcloud_web_root }}/occ"
      - user:setting
      - "{{ nextcloud_admin_user }}"
      - settings
      - email
      - "{{ nextcloud_admin_email }}"
  changed_when: false

- name: Définir le mode SMTP
  ansible.builtin.command:
    argv:
      - sudo
      - -u
      - www-data
      - php
      - "{{ nextcloud_web_root }}/occ"
      - config:system:set
      - mail_smtpmode
      - --value={{ nextcloud_mail_smtpmode }}
  changed_when: false
  when: "'installed: true' in nextcloud_status_mail.stdout"

- name: Définir l'hôte SMTP
  ansible.builtin.command:
    argv:
      - sudo
      - -u
      - www-data
      - php
      - "{{ nextcloud_web_root }}/occ"
      - config:system:set
      - mail_smtphost
      - --value={{ nextcloud_mail_smtphost }}
