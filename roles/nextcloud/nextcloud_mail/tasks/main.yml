  ansible.builtin.command:
    argv:
      - sudo
      - -u
      - www-data
      - php
      - "{{ nextcloud_web_root }}/occ"
      - config:system:set
      - mail_smtpdebug
      - --type=boolean
      - --value=false
  changed_when: false
  when: "'installed: true' in nextcloud_status_mail.stdout"