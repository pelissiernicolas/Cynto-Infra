---
- name: Télécharger Zabbix Agent 2 MSI
  ansible.windows.win_get_url:
    url: "{{ zabbix_agent2_windows_msi_url }}"
    dest: "{{ zabbix_agent2_windows_msi_path }}"

- name: Installer Zabbix Agent 2
  ansible.windows.win_package:
    path: "{{ zabbix_agent2_windows_msi_path }}"
    state: present
    arguments: >-
      /qn
      SERVER={{ zabbix_agent_server }}
      SERVERACTIVE={{ zabbix_agent_server_active }}
      HOSTNAME={{ zabbix_agent_hostname }}
      LISTENPORT={{ zabbix_agent_listen_port }}

- name: Autoriser Zabbix Agent 2 dans le pare-feu Windows
  community.windows.win_firewall_rule:
    name: Zabbix Agent 2
    localport: "{{ zabbix_agent_listen_port }}"
    action: allow
    direction: in
    protocol: tcp
    state: present
    enabled: true

- name: Démarrer et activer Zabbix Agent 2
  ansible.windows.win_service:
    name: "Zabbix Agent 2"
    start_mode: auto
    state: started
