---
- name: Installer les outils SNMP sur le serveur Zabbix
  ansible.builtin.apt:
    name: snmp
    state: present
    update_cache: true
    lock_timeout: 300
  become: true

- name: Tester les cibles SNMP depuis Zabbix
  ansible.builtin.command:
    argv:
      - snmpget
      - -v2c
      - -c
      - "{{ item.community }}"
      - -t
      - "3"
      - -r
      - "1"
      - "{{ item.ip }}"
      - "1.3.6.1.2.1.1.1.0"
  loop: "{{ zabbix_snmp_test_targets }}"
  loop_control:
    label: "{{ item.name }} ({{ item.ip }})"
  register: zabbix_snmp_test_results
  changed_when: false
  failed_when: false
  no_log: true

- name: Afficher les résultats SNMP
  ansible.builtin.debug:
    msg: "{{ item.item.name }} {{ item.item.ip }} -> {{ 'OK' if item.rc == 0 else 'ECHEC: ' ~ (item.stderr | default(item.stdout)) }}"
  loop: "{{ zabbix_snmp_test_results.results }}"
  loop_control:
    label: "{{ item.item.name }}"
