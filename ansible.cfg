[defaults]
inventory = inventories/prod/hosts.yml
# Les rôles sont rangés par service ; chaque sous-dossier est ajouté au chemin de recherche.
# Ansible résout les rôles par leur nom (uniques) dans l'un de ces dossiers.
roles_path = roles/ad:roles/pfsense:roles/nextcloud:roles/glpi:roles/shared
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
